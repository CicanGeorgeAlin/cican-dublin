name: Deploy CICAN DUBLIN

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cican-dublin-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check map app JavaScript syntax
        run: |
          node --check preview/app/app.js
          node --check preview/service-worker.js
          node --check service-worker.js
      - name: Check SEO page generator syntax
        run: node --check scripts/generate-seo-pages.mjs
      - name: Generate crawlable place pages and full sitemap
        run: node scripts/generate-seo-pages.mjs
      - name: Run archive safety preflight
        run: node scripts/validate-archive.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Render social preview PNG
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert --width 1200 --height 630 --output assets/social-preview.png assets/social-preview.svg
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
