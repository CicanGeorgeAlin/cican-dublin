name: Validate CICAN DUBLIN

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cican-dublin-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check map and service worker JavaScript syntax
        run: |
          node --check preview/app/app.js
          node --check preview/app/app-canonical.js
          node --check preview/service-worker.js
          node --check service-worker.js
      - name: Test CICAN walking navigation UI and routing integration
        run: node --test scripts/test-cican-navigation.mjs
      - name: Test Stage 2 route progress, maneuver distance and ETA calculations
        run: node --test scripts/test-cican-navigation-progress.mjs
      - name: Test GPS session analysis report
        run: node --test scripts/test-analyze-gps-session.mjs
      - name: Check SEO page generator syntax
        run: node --check scripts/generate-seo-pages.mjs
      - name: Generate crawlable place pages and full sitemap
        run: node scripts/generate-seo-pages.mjs
      - name: Verify every published place page uses CICAN navigation
        run: node --test scripts/test-cican-navigation-sitewide.mjs
      - name: Test canonical archive map compatibility prototype
        run: node scripts/test-canonical-map-compatibility.mjs
      - name: Install isolated browser test dependencies
        run: npm install --no-save --no-package-lock playwright@1.56.1 maplibre-gl@5.12.0
      - name: Install Chromium for browser prototype tests
        run: npx playwright install --with-deps chromium
      - name: Test full archive map prototype in Chromium
        run: node scripts/test-canonical-map-browser.mjs
      - name: Run archive safety preflight
        run: node scripts/validate-archive.mjs
