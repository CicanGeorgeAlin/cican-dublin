name: Deploy CICAN DUBLIN
# Fresh deployment run after retry artifact collision; keep production workflow unchanged.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cican-dublin-pages-v2
  cancel-in-progress: true

jobs:
  test-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check map app JavaScript syntax
        run: |
          node --check preview/app/app.js
          node --check preview/service-worker.js
          node --check service-worker.js
      - name: Test CICAN walking navigation UI and routing integration
        run: node --test scripts/test-cican-navigation.mjs
  deploy:
    if: github.event_name != 'pull_request'
    needs: test-navigation
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check map app JavaScript syntax
        run: |
          node --check preview/app/app.js
          node --check preview/service-worker.js
          node --check service-worker.js
      - name: Test CICAN walking navigation UI and routing integration
        run: node --test scripts/test-cican-navigation.mjs
      - name: Check SEO page generator syntax
        run: node --check scripts/generate-seo-pages.mjs
      - name: Generate crawlable place pages and full sitemap
        run: node scripts/generate-seo-pages.mjs
      - name: Verify every published place page uses CICAN navigation
        run: node --test scripts/test-cican-navigation-sitewide.mjs
      - name: Run archive safety preflight
        run: node scripts/validate-archive.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Render social preview PNG
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert --width 1200 --height 630 --output assets/social-preview.png assets/social-preview.svg
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
