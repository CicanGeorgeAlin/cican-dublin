name: Publish CICAN Dublin NIAH Core Batches 087–089

on:
  push:
    branches: [main]
    paths:
      - "scripts/publish-niah-batches-087-089.mjs"
      - "audit/batch-087-089-publication-input.json"
      - ".github/workflows/publish-niah-batches-087-089.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: niah-core-publication-087-089
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build latest official four-authority missing-registration queue
        run: node scripts/audit-niah-dublin-coverage.mjs

      - name: Reconcile all 14 candidates against complete catalogues and official national rows, then publish core records
        run: node scripts/publish-niah-batches-087-089.mjs --apply

      - name: Generate crawlable place pages and full sitemap
        run: node scripts/generate-seo-pages.mjs

      - name: Validate catalogue, images, links, coordinates and generated pages
        run: node scripts/validate-archive.mjs

      - name: Audit all public NIAH registrations against the official national CSV
        run: node scripts/audit-niah-registrations.mjs

      - name: Rebuild four-authority Dublin coverage and remaining review queue
        run: node scripts/audit-niah-dublin-coverage.mjs

      - name: Commit validated catalogue, source, visual and page updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/objects.json data/niah-registered-objects.json data/sources.json data/visual-assets.json data/coverage-audit.json README.md places sitemap.xml
          git add audit/niah-batches-087-089-publication.json audit/niah-batches-087-089-publication-preflight.json
          git add audit/niah-340-official-register-audit.json audit/niah-dublin-coverage-audit.json
          git add documentation/CICAN-HYBRID-NIAH-PUBLICATION-BATCHES-087-089.md
          git commit -m "Publish 14 verified NIAH core records from batches 087–089"
          git push origin HEAD:main

      - name: Dispatch GitHub Pages deployment for the validated catalogue commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Upload publication and official audit reports
        uses: actions/upload-artifact@v4
        with:
          name: cican-niah-batches-087-089-publication
          path: |
            documentation/CICAN-HYBRID-NIAH-PUBLICATION-BATCHES-087-089.md
            audit/niah-batches-087-089-publication.json
            audit/niah-batches-087-089-publication-preflight.json
            audit/niah-340-official-register-audit.json
            audit/niah-dublin-coverage-audit.json
            audit/niah-dublin-missing-registrations.json
          if-no-files-found: error
