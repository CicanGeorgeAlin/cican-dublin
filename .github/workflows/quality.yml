name: Archive quality gate
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: archive-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate catalogue, images, links and page scripts
        run: node scripts/validate-archive.mjs
