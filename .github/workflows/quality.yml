name: Archive quality gate
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: archive-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check map application JavaScript syntax
        run: |
          node --check preview/app/app.js
          node --check preview/service-worker.js
          node --check service-worker.js
      - name: Install isolated JSON Schema 2020-12 validator
        run: npm install --no-save --no-package-lock ajv@8 ajv-formats@3
      - name: Formally validate canonical and NIAH archive records and report migration gaps
        run: node scripts/audit-canonical-schema-readiness.mjs
      - name: Test live GPS tracking start, updates, stop and errors
        run: node --test scripts/test-live-gps-tracking.mjs
      - name: Test GPS session analysis report
        run: node --test scripts/test-analyze-gps-session.mjs
      - name: Test CICAN pedestrian navigation route integration and polyline decoding
        run: node --test scripts/test-cican-navigation.mjs
      - name: Check SEO page generator syntax
        run: node --check scripts/generate-seo-pages.mjs
      - name: Generate crawlable place pages and full sitemap
        run: node scripts/generate-seo-pages.mjs
      - name: Test site-wide CICAN navigation links after page generation
        run: node --test scripts/test-cican-navigation-sitewide.mjs
      - name: Validate catalogue, images, links and page scripts
        run: node scripts/validate-archive.mjs
      - name: Audit existing NIAH registrations against the official national CSV
        run: node scripts/audit-niah-registrations.mjs
      - name: Build four-authority Dublin NIAH coverage and missing-registration queue
        run: node scripts/audit-niah-dublin-coverage.mjs
      - name: Preflight 14 core publication candidates from research Batches 087–089
        if: github.event_name == 'pull_request' && !hashFiles('audit/niah-batches-087-089-publication.json')
        run: node scripts/publish-niah-batches-087-089.mjs --check
      - name: Reconcile Batch 058 and 059 research candidates against complete catalogues and official CSV
        run: node scripts/reconcile-niah-batches-058-059.mjs
      - name: Upload official NIAH audit reports and review queue
        uses: actions/upload-artifact@v4
        with:
          name: niah-dublin-bulk-coverage-audit
          path: |
            audit/niah-340-official-register-audit.json
            audit/niah-dublin-coverage-audit.json
            audit/niah-dublin-missing-registrations.json
            audit/niah-batches-058-059-candidate-reconciliation.json
            audit/niah-batches-087-089-publication-preflight.json
            audit/canonical-data-contract-readiness.json
          if-no-files-found: error
      - name: Persist fresh NIAH audit and missing-registration queue on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/audit-niah-registrations.mjs
            node scripts/audit-niah-dublin-coverage.mjs
            git add audit/niah-340-official-register-audit.json audit/niah-dublin-coverage-audit.json audit/niah-dublin-missing-registrations.json
            if git diff --cached --quiet; then
              echo "Official NIAH audit and queue are unchanged."
              exit 0
            fi
            git commit -m "Update official NIAH audit and missing-registration queue"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main advanced during audit persistence; refreshing and retrying."
          done
          echo "Unable to persist audit after three safe fast-forward attempts."
          exit 1
