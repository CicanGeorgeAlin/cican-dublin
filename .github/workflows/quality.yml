name: Archive quality gate
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: archive-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check map application JavaScript syntax
        run: |
          node --check preview/app/app.js
          node --check preview/service-worker.js
          node --check service-worker.js
      - name: Check SEO page generator syntax
        run: node --check scripts/generate-seo-pages.mjs
      - name: Generate crawlable place pages and full sitemap
        run: node scripts/generate-seo-pages.mjs
      - name: Validate catalogue, images, links and page scripts
        run: node scripts/validate-archive.mjs
