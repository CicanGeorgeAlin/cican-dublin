name: Archive quality gate
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: archive-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check map application JavaScript syntax
        run: |
          node --check preview/app/app.js
          node --check preview/service-worker.js
          node --check service-worker.js
      - name: Check SEO page generator syntax
        run: node --check scripts/generate-seo-pages.mjs
      - name: Generate crawlable place pages and full sitemap
        run: node scripts/generate-seo-pages.mjs
      - name: Validate catalogue, images, links and page scripts
        run: node scripts/validate-archive.mjs
      - name: Audit existing NIAH registrations against the official national CSV
        run: node scripts/audit-niah-registrations.mjs
      - name: Build four-authority Dublin NIAH coverage and missing-registration queue
        run: node scripts/audit-niah-dublin-coverage.mjs
      - name: Preflight 14 core publication candidates from research Batches 087–089
        if: github.event_name == 'pull_request' && hashFiles('audit/niah-batches-087-089-publication.json') == ''
        run: node scripts/publish-niah-batches-087-089.mjs --check
      - name: Verify previously published 14 core candidates from research Batches 087–089
        if: github.event_name == 'pull_request' && hashFiles('audit/niah-batches-087-089-publication.json') != ''
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const report = JSON.parse(fs.readFileSync("audit/niah-batches-087-089-publication.json", "utf8"));
          const objects = JSON.parse(fs.readFileSync("data/objects.json", "utf8"));
          const publicNiah = JSON.parse(fs.readFileSync("data/niah-registered-objects.json", "utf8"));
          const sources = JSON.parse(fs.readFileSync("data/sources.json", "utf8"));
          const visual = JSON.parse(fs.readFileSync("data/visual-assets.json", "utf8"));
          assert.equal(report.decision, "PUBLISHED");
          assert.equal(report.published_candidate_count, 14);
          assert.equal(report.registrations.length, 14);
          for (const item of report.registrations) {
            assert.equal(publicNiah.filter(x => x.national_inventory_reference === item.registration).length, 1, item.registration + " must occur once in the public NIAH register");
            const object = objects.find(x => x.id === item.archive_id);
            assert.ok(object, item.archive_id + " must exist in the master catalogue");
            assert.equal(object.national_inventory_reference, item.registration);
            assert.ok(sources.some(x => x.id === "NIAH-" + item.registration), "source record missing for " + item.registration);
            assert.ok(visual.records.some(x => x.record_id === item.archive_id), "visual record missing for " + item.archive_id);
          }
          console.log("PASS: all 14 previously published NIAH records reconcile across the publication report, master catalogue, public register, source registry and visual inventory.");
          NODE
      - name: Reconcile Batch 090 candidates against the full catalogue and refreshed official queue
        run: node scripts/reconcile-niah-batch-090.mjs
      - name: Reconcile Batch 091 25-record scale-up pilot
        run: node scripts/reconcile-niah-batch-091-25.mjs
      - name: Reconcile Batch 092 50-record normal batch
        run: node scripts/reconcile-niah-batch-092-50.mjs
      - name: Reconcile Batch 093 50-record normal batch
        run: node scripts/reconcile-niah-batch-093-50.mjs
      - name: Reconcile Batch 094 50-record normal batch
        run: node scripts/reconcile-niah-batch-094-50.mjs
      - name: Reconcile Batch 095 50-record normal batch
        run: node scripts/reconcile-niah-batch-095-50.mjs
      - name: Reconcile Batch 096 50-record normal batch
        run: node scripts/reconcile-niah-batch-096-50.mjs
      - name: Reconcile Batch 097 50-record normal batch
        run: node scripts/reconcile-niah-batch-097-50.mjs
      - name: Reconcile Batch 098 50-record normal batch
        run: node scripts/reconcile-niah-batch-098-50.mjs
      - name: Reconcile Batch 099 50-record normal batch
        run: node scripts/reconcile-niah-batch-099-50.mjs
      - name: Reconcile Batch 100 50-record normal batch
        run: node scripts/reconcile-niah-batch-100-50.mjs
      - name: Reconcile Batch 101 50-record normal batch
        run: node scripts/reconcile-niah-batch-101-50.mjs
      - name: Reconcile Batch 102 50-record normal batch
        run: node scripts/reconcile-niah-batch-102-50.mjs
      - name: Reconcile Batch 103 50-record normal batch
        run: node scripts/reconcile-niah-batch-103-50.mjs
      - name: Reconcile Batch 058 and 059 research candidates against complete catalogues and official CSV
        run: node scripts/reconcile-niah-batches-058-059.mjs
      - name: Upload official NIAH audit reports and review queue
        uses: actions/upload-artifact@v4
        with:
          name: niah-dublin-bulk-coverage-audit
          path: |
            audit/niah-340-official-register-audit.json
            audit/niah-dublin-coverage-audit.json
            audit/niah-dublin-missing-registrations.json
            audit/niah-batches-058-059-candidate-reconciliation.json
            audit/niah-batches-087-089-publication-preflight.json
            audit/batch-090-candidate-reconciliation.json
            audit/batch-091-25-candidate-reconciliation.json
            audit/batch-092-50-candidate-reconciliation.json
            audit/batch-093-50-candidate-reconciliation.json
            audit/batch-094-50-candidate-reconciliation.json
            audit/batch-095-50-candidate-reconciliation.json
            audit/batch-096-50-candidate-reconciliation.json
            audit/batch-097-50-candidate-reconciliation.json
            audit/batch-098-50-candidate-reconciliation.json
            audit/batch-099-50-candidate-reconciliation.json
            audit/batch-100-50-candidate-reconciliation.json
            audit/batch-101-50-candidate-reconciliation.json
            audit/batch-102-50-candidate-reconciliation.json
            audit/batch-103-50-candidate-reconciliation.json
          if-no-files-found: error
